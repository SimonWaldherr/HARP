name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            harp/go.sum
            harpserver/go.sum
            demos/remote-helper-go/go.sum
            demos/advanced-enterprise/go.sum

      - name: Verify Dependencies
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Format Check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: make vet-all

      - name: Test
        run: make test-all

      - name: Build
        run: make build

      - name: Docker Compose Config
        run: docker compose config >/dev/null

      - name: Docker Build
        run: docker build -t harp:ci .
